name: Visual regression — kafel 02 (/rozwiązania)

# Visual regression dla kafla 02 ("Tekstura « HD »") na trzech viewportach:
# mobile (390x1200), tablet (834x1400), desktop (1440x1600).
#
# Domyślnie testuje URL produkcyjny (https://glow-medspa-hub.lovable.app),
# więc nadaje się do uruchomienia po każdym deployu (workflow_dispatch
# lub schedule). Baseline'y trzymane są w
# tests/e2e/__baselines__/tile-02/<viewport>.png.
#
# Aby zaktualizować baseline'y (np. po świadomej zmianie wizualnej):
#   UPDATE_BASELINES=1 npm run test:e2e:tile02-visual
# i zacommitować nowe PNG-i.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Bazowy URL do testowania (np. preview deploya)"
        required: false
        default: "https://glow-medspa-hub.lovable.app"
  schedule:
    # Codziennie 06:00 UTC — wyłapie regresje wprowadzone w nocy.
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "src/routes/rozwiazania.tsx"
      - "src/components/PakietTile.tsx"
      - "src/assets/tekstura-hd-twarz.png.asset.json"
      - "tests/e2e/tile_02_visual_regression.py"
      - "tests/e2e/__baselines__/tile-02/**"
      - ".github/workflows/visual-regression-tile-02.yml"

jobs:
  visual-regression:
    name: Visual regression · kafel 02
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Playwright version
        id: pw
        run: |
          PW_VERSION=$(python -c "import urllib.request, json; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/playwright/json').read())['info']['version'])")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright (Python) + Pillow
        run: |
          python -m pip install "playwright==${{ steps.pw.outputs.version }}" Pillow
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Run visual regression
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://glow-medspa-hub.lovable.app' }}
        run: python3 tests/e2e/tile_02_visual_regression.py

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tile-02-visual-diff
          path: /tmp/browser/tile-02-visual
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          {
            echo "## Visual regression — kafel 02"
            echo ""
            echo "- URL: \`${{ github.event.inputs.base_url || 'https://glow-medspa-hub.lovable.app' }}\`"
            echo "- Viewporty: mobile 390x1200, tablet 834x1400, desktop 1440x1600"
            echo "- Selektor: \`#tekstura-hd\`"
            if [ "${{ job.status }}" != "success" ]; then
              echo ""
              echo "❌ Regresja wizualna — pobierz artifact \`tile-02-visual-diff\`, żeby zobaczyć \`*-diff.png\` i \`*-actual.png\`."
              echo ""
              echo "Jeśli zmiana jest oczekiwana, zaktualizuj baseline'y:"
              echo '\`\`\`'
              echo "UPDATE_BASELINES=1 npm run test:e2e:tile02-visual"
              echo '\`\`\`'
              echo "i zacommituj nowe PNG-i z \`tests/e2e/__baselines__/tile-02/\`."
            else
              echo ""
              echo "✅ Zgodne z baseline'ami."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
