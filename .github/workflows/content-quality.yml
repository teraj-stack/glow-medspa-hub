name: Content Quality

on:
  pull_request:
    paths:
      - "src/routes/**"
      - "scripts/validate-content.mjs"
      - "tests/e2e/content_quality.py"
      - ".github/workflows/content-quality.yml"
  push:
    branches: [main]

jobs:
  validate:
    name: Static validator (technologie, blog, faq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validator with JSON+HTML report
        run: |
          mkdir -p reports
          # --warn → nie pada od razu; status weryfikujemy poniżej, żeby raport
          # zawsze trafił do artifactów PR-a, nawet przy błędach.
          node scripts/validate-content.mjs \
            --section=all \
            --json=reports/content-quality.json \
            --html=reports/content-quality.html \
            --warn

      - name: Upload content-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-report
          path: reports/
          if-no-files-found: error

      - name: Fail PR if validator found issues
        run: |
          ISSUES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/content-quality.json','utf8')).findings.length)")
          echo "Problemów: $ISSUES"
          if [ "$ISSUES" -gt 0 ]; then
            echo "✗ Walidacja treści nie przeszła — szczegóły w artifact 'content-quality-report'."
            exit 1
          fi

  e2e:
    name: E2E content quality
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Log node_modules cache status
        run: |
          if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ node_modules cache HIT — dependencies restored from cache"
          else
            echo "✗ node_modules cache MISS — running npm ci"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        id: npm-ci
        run: |
          START=$(date +%s)
          npm ci
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "npm ci duration: ${DURATION}s"

      - name: Summary — node_modules cache & npm ci
        if: always()
        run: |
          {
            echo "## node_modules cache & npm ci"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Cache hit | \`${{ steps.node-modules-cache.outputs.cache-hit }}\` |"
            if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" = "true" ]; then
              echo "| npm ci duration | skipped (cache hit) |"
            else
              echo "| npm ci duration | ${{ steps.npm-ci.outputs.duration }}s |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright (Python)
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev -- --port 8080 --host 127.0.0.1 > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            curl -sfo /dev/null http://127.0.0.1:8080/technologie && exit 0
            sleep 1
          done
          echo "Dev server nie wystartował"
          tail -100 /tmp/dev.log
          exit 1

      - name: Run e2e content quality
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          REPORT_JSON: reports/e2e-content-quality.json
        run: |
          mkdir -p reports
          python3 tests/e2e/content_quality.py

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev.pid)" 2>/dev/null || true

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-content-quality-report
          path: |
            reports/e2e-content-quality.json
            /tmp/browser/content-quality/last.png
          if-no-files-found: ignore
