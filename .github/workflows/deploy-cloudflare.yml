name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-deploy-security:
    name: Pre-deploy security gate (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate lockfile for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: npm audit (fail on high/critical, prod deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  pre-deploy-lighthouse:
    name: Pre-deploy Lighthouse gate (LCP/CLS/perf)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build
      - run: npm install -g @lhci/cli@0.14.x
      - name: Lighthouse CI (${{ matrix.profile }})
        run: lhci autorun --config=./.lighthouserc.${{ matrix.profile }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-deploy-${{ matrix.profile }}-${{ github.run_id }}
          path: .lighthouseci/${{ matrix.profile }}
          retention-days: 90

  deploy:
    needs: [pre-deploy-security, pre-deploy-lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Nitro cloudflare-module preset)
        env:
          NITRO_PRESET: cloudflare-module
          # Klient (VITE_*) — muszą być dostępne w build time
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      - name: Post-deploy — wymuś re-scrape kart OG/Twitter u sociali
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Daj Cloudflare kilka sekund na propagację nowej wersji Workera.
          sleep 15
          echo "Triggering OG re-scrape hook…"
          HTTP_STATUS=$(curl -sS -o /tmp/og-rescrape.json -w "%{http_code}" \
            -X POST "https://bmclinics.ai/api/public/hooks/og-rescrape" \
            -H "Content-Type: application/json" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --max-time 120 \
            -d '{}') || true
          echo "HTTP status: ${HTTP_STATUS}"
          head -c 4000 /tmp/og-rescrape.json || true
          echo
          # Nie blokujemy deployu przy błędzie re-scrape — social crawlerzy i tak
          # odświeżą się przy pierwszym udostępnieniu. Pokazujemy tylko status.
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::warning::OG re-scrape zwrócił HTTP ${HTTP_STATUS} — sprawdź logi hooka."
          fi
