name: Content Quality (scheduled)

# Cykliczna re-walidacja treści bloga i FAQ.
# Uruchamia się codziennie o 05:30 UTC (07:30 w PL latem, 06:30 zimą),
# nawet jeśli pliki źródłowe nie zostały zmienione.
# Wykrywa regresje typograficzne pojawiające się np. po zmianach reguł
# walidatora, aktualizacji zależności lub edycjach contentu na innej gałęzi.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      section:
        description: "Sekcja do walidacji (all | blog | faq | technologie)"
        required: false
        default: "blog,faq"

jobs:
  validate:
    name: Static validator (blog + faq, scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine sections
        id: sections
        run: |
          SECTIONS="${{ github.event.inputs.section }}"
          if [ -z "$SECTIONS" ]; then
            SECTIONS="blog,faq"
          fi
          echo "value=$SECTIONS" >> "$GITHUB_OUTPUT"

      - name: Run validator (blog + faq)
        run: |
          mkdir -p reports
          node scripts/validate-content.mjs \
            --section=${{ steps.sections.outputs.value }} \
            --json=reports/content-quality-scheduled.json \
            --html=reports/content-quality-scheduled.html \
            --warn

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-scheduled-report
          path: reports/
          if-no-files-found: error

      - name: Fail job if issues detected
        run: |
          ISSUES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/content-quality-scheduled.json','utf8')).findings.length)")
          echo "Problemów: $ISSUES"
          if [ "$ISSUES" -gt 0 ]; then
            echo "✗ Cykliczna walidacja blog/FAQ wykryła problemy — zobacz artifact 'content-quality-scheduled-report'."
            exit 1
          fi

  e2e:
    name: E2E re-validation (blog + faq, scheduled)
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        run: npm ci

      - name: Install Playwright (Python)
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev -- --port 8080 --host 127.0.0.1 > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            curl -sfo /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          echo "Dev server nie wystartował"
          tail -100 /tmp/dev.log
          exit 1

      - name: Run e2e content quality
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_SECTIONS: "blog,faq"
          REPORT_JSON: reports/e2e-content-quality-scheduled.json
        run: |
          mkdir -p reports
          python3 tests/e2e/content_quality.py

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev.pid)" 2>/dev/null || true

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-content-quality-scheduled-report
          path: |
            reports/e2e-content-quality-scheduled.json
            /tmp/browser/content-quality/last.png
          if-no-files-found: ignore
