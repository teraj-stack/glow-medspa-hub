name: Content Quality (scheduled)

# Cykliczna re-walidacja treści bloga i FAQ.
# Uruchamia się codziennie o 05:30 UTC, nawet jeśli pliki źródłowe się
# nie zmieniły. Każda sekcja (blog, faq) ma własne, niezależne joby:
#   - validate-<section>  → statyczny walidator scripts/validate-content.mjs
#   - e2e-<section>       → Playwright (Python) na uruchomionym dev serverze
# Dzięki temu w UI Actions widać dokładnie, która sekcja i która warstwa
# (static / e2e) zgłosiła problem.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

jobs:
  # ─────────────────────────── STATIC ───────────────────────────

  validate-blog:
    name: Static · blog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate blog
        run: |
          mkdir -p reports
          node scripts/validate-content.mjs \
            --section=blog \
            --json=reports/content-quality-blog.json \
            --html=reports/content-quality-blog.html \
            --warn

      - name: Upload blog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-blog
          path: |
            reports/content-quality-blog.json
            reports/content-quality-blog.html
          if-no-files-found: error

      - name: Fail if blog has issues
        run: |
          ISSUES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/content-quality-blog.json','utf8')).findings.length)")
          echo "Problemów (blog): $ISSUES"
          if [ "$ISSUES" -gt 0 ]; then
            echo "✗ Statyczna walidacja BLOG — szczegóły w artifact 'content-quality-blog'."
            exit 1
          fi

  validate-faq:
    name: Static · faq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate faq
        run: |
          mkdir -p reports
          node scripts/validate-content.mjs \
            --section=faq \
            --json=reports/content-quality-faq.json \
            --html=reports/content-quality-faq.html \
            --warn

      - name: Upload faq report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-faq
          path: |
            reports/content-quality-faq.json
            reports/content-quality-faq.html
          if-no-files-found: error

      - name: Fail if faq has issues
        run: |
          ISSUES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/content-quality-faq.json','utf8')).findings.length)")
          echo "Problemów (faq): $ISSUES"
          if [ "$ISSUES" -gt 0 ]; then
            echo "✗ Statyczna walidacja FAQ — szczegóły w artifact 'content-quality-faq'."
            exit 1
          fi

  # ─────────────────────────── E2E ───────────────────────────

  e2e-blog:
    name: E2E · blog
    runs-on: ubuntu-latest
    needs: validate-blog
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache ~/.npm (npm cache)
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Log cache status
        run: |
          if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ node_modules cache HIT — dependencies restored from cache"
          else
            echo "✗ node_modules cache MISS — running npm ci"
          fi
          if [ "${{ steps.npm-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ ~/.npm cache HIT — npm download cache restored"
          else
            echo "✗ ~/.npm cache MISS (or restored via restore-keys)"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install JS dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        id: npm-ci
        run: |
          START=$(date +%s)
          npm ci --prefer-offline --no-audit --no-fund
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "npm ci duration: ${DURATION}s"

      - name: Summary — caches & npm ci
        if: always()
        run: |
          {
            echo "## caches & npm ci"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| node_modules cache hit | \`${{ steps.node-modules-cache.outputs.cache-hit }}\` |"
            echo "| ~/.npm cache hit | \`${{ steps.npm-cache.outputs.cache-hit }}\` |"
            if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" = "true" ]; then
              echo "| npm ci duration | skipped (cache hit) |"
            else
              echo "| npm ci duration | ${{ steps.npm-ci.outputs.duration }}s |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Resolve Playwright version
        id: pw
        run: |
          PW_VERSION=$(python -c "import urllib.request, json; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/playwright/json').read())['info']['version'])")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright (Python)
        run: |
          python -m pip install "playwright==${{ steps.pw.outputs.version }}"
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi


      - name: Start dev server
        run: |
          npm run dev -- --port 8080 --host 127.0.0.1 > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            curl -sfo /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          echo "Dev server nie wystartował"; tail -100 /tmp/dev.log; exit 1

      - name: Run e2e (blog)
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_SECTIONS: "blog"
          REPORT_JSON: reports/e2e-content-quality-blog.json
        run: |
          mkdir -p reports
          python3 tests/e2e/content_quality.py

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev.pid)" 2>/dev/null || true

      - name: Upload e2e blog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-content-quality-blog
          path: |
            reports/e2e-content-quality-blog.json
            /tmp/browser/content-quality/last.png
          if-no-files-found: ignore

  e2e-faq:
    name: E2E · faq
    runs-on: ubuntu-latest
    needs: validate-faq
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Log node_modules cache status
        run: |
          if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ node_modules cache HIT — dependencies restored from cache"
          else
            echo "✗ node_modules cache MISS — running npm ci"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install JS dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        id: npm-ci
        run: |
          START=$(date +%s)
          npm ci
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "npm ci duration: ${DURATION}s"

      - name: Summary — node_modules cache & npm ci
        if: always()
        run: |
          {
            echo "## node_modules cache & npm ci"
            echo ""
            echo "| Item | Value |"
            echo "| ---- | ----- |"
            echo "| Cache hit | \`${{ steps.node-modules-cache.outputs.cache-hit }}\` |"
            if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" = "true" ]; then
              echo "| npm ci duration | skipped (cache hit) |"
            else
              echo "| npm ci duration | ${{ steps.npm-ci.outputs.duration }}s |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Playwright version
        id: pw
        run: |
          PW_VERSION=$(python -c "import urllib.request, json; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/playwright/json').read())['info']['version'])")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright (Python)
        run: |
          python -m pip install "playwright==${{ steps.pw.outputs.version }}"
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi


      - name: Start dev server
        run: |
          npm run dev -- --port 8080 --host 127.0.0.1 > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            curl -sfo /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          echo "Dev server nie wystartował"; tail -100 /tmp/dev.log; exit 1

      - name: Run e2e (faq)
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_SECTIONS: "faq"
          REPORT_JSON: reports/e2e-content-quality-faq.json
        run: |
          mkdir -p reports
          python3 tests/e2e/content_quality.py

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev.pid)" 2>/dev/null || true

      - name: Upload e2e faq report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-content-quality-faq
          path: |
            reports/e2e-content-quality-faq.json
            /tmp/browser/content-quality/last.png
          if-no-files-found: ignore
