name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI (${{ matrix.profile }})
        id: lhci
        run: lhci autorun --config=./.lighthouserc.${{ matrix.profile }}.json
        continue-on-error: true

      - name: Extract /technologie metrics
        if: always()
        id: metrics
        uses: actions/github-script@v7
        env:
          PROFILE: ${{ matrix.profile }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const profile = process.env.PROFILE;
            const dir = `.lighthouseci/${profile}`;
            const targetPath = '/technologie';

            const thresholds = profile === 'mobile'
              ? { lcp: 2500, cls: 0.1, perf: 0.9 }
              : { lcp: 2000, cls: 0.1, perf: 0.9 };

            const manifestPath = path.join(dir, 'manifest.json');
            if (!fs.existsSync(manifestPath)) {
              core.setFailed(`Manifest missing at ${manifestPath} — Lighthouse run did not produce output.`);
              core.setOutput('summary', `❌ **Lighthouse (${profile})** — brak raportu (build/run failed).`);
              core.setOutput('passed', 'false');
              return;
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

            // Pick representative runs for /technologie (prefer isRepresentativeRun)
            const matches = manifest.filter(m => {
              try { return new URL(m.url).pathname === targetPath; } catch { return false; }
            });
            const picked = matches.filter(m => m.isRepresentativeRun);
            const runs = (picked.length ? picked : matches);
            if (!runs.length) {
              core.setOutput('summary', `⚠️ **Lighthouse (${profile})** — brak pomiarów dla \`${targetPath}\`.`);
              core.setOutput('passed', 'false');
              return;
            }

            const rows = [];
            let allPassed = true;
            for (const run of runs) {
              const report = JSON.parse(fs.readFileSync(run.jsonPath, 'utf8'));
              const a = report.audits;
              const lcp = a['largest-contentful-paint']?.numericValue ?? NaN;
              const cls = a['cumulative-layout-shift']?.numericValue ?? NaN;
              const fcp = a['first-contentful-paint']?.numericValue ?? NaN;
              const tbt = a['total-blocking-time']?.numericValue ?? NaN;
              const perfScore = report.categories?.performance?.score ?? 0;
              const lcpOk = lcp <= thresholds.lcp;
              const clsOk = cls <= thresholds.cls;
              const perfOk = perfScore >= thresholds.perf;
              if (!(lcpOk && clsOk && perfOk)) allPassed = false;
              rows.push({ lcp, cls, fcp, tbt, perfScore, lcpOk, clsOk, perfOk });
            }

            const fmt = (n, unit = 'ms') => Number.isFinite(n) ? `${(n).toFixed(unit === 'ms' ? 0 : 3)}${unit === 'ms' ? ' ms' : ''}` : 'n/a';
            const r = rows[0]; // representative
            const icon = (ok) => ok ? '✅' : '❌';

            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`;
            const htmlPath = runs[0]?.htmlPath
              ? path.relative(`.lighthouseci/${profile}`, runs[0].htmlPath)
              : '';
            const reportHtmlNote = htmlPath
              ? `Pełny raport HTML po rozpakowaniu: \`${htmlPath}\``
              : 'Pełny raport HTML dostępny w artefaktach powyżej.';

            const summary = [
              `### ${icon(allPassed)} Lighthouse (${profile}) — \`${targetPath}\``,
              ``,
              `| Metryka | Wynik | Próg | Status |`,
              `| --- | ---: | ---: | :---: |`,
              `| Performance | ${(r.perfScore * 100).toFixed(0)} | ≥ ${(thresholds.perf * 100).toFixed(0)} | ${icon(r.perfOk)} |`,
              `| **LCP** | **${fmt(r.lcp)}** | < ${thresholds.lcp} ms | ${icon(r.lcpOk)} |`,
              `| **CLS** | **${r.cls.toFixed(3)}** | < ${thresholds.cls} | ${icon(r.clsOk)} |`,
              `| FCP | ${fmt(r.fcp)} | — | – |`,
              `| TBT | ${fmt(r.tbt)} | — | – |`,
              ``,
              `_Reprezentatywny przebieg z ${runs.length} pomiaru/ów. [Pobierz artefakty \`lhci-${profile}-${context.runId}\`](${artifactUrl}). ${reportHtmlNote}_`,
            ].join('\n');

            core.setOutput('summary', summary);
            core.setOutput('passed', allPassed ? 'true' : 'false');
            core.setOutput('artifactUrl', artifactUrl);
            core.setOutput('htmlPath', htmlPath);
            core.setOutput('reportHtmlNote', reportHtmlNote);
            await core.summary.addRaw(summary).write();

      - name: Comment Lighthouse results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PROFILE: ${{ matrix.profile }}
          BODY: ${{ steps.metrics.outputs.summary }}
          ARTIFACT_URL: ${{ steps.metrics.outputs.artifactUrl }}
          HTML_PATH: ${{ steps.metrics.outputs.htmlPath }}
          REPORT_NOTE: ${{ steps.metrics.outputs.reportHtmlNote }}
        with:
          script: |
            const profile = process.env.PROFILE;
            const body = process.env.BODY;
            const artifactUrl = process.env.ARTIFACT_URL;
            const htmlPath = process.env.HTML_PATH;
            const reportNote = process.env.REPORT_NOTE;
            if (!body) return;
            const marker = `<!-- lhci-comment:${profile}:/technologie -->`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Resolve a direct link to the uploaded artifact if available
            const artifactName = `lhci-${profile}-${context.runId}`;
            let directArtifactUrl = artifactUrl;
            try {
              const { data: runArtifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: context.runId,
              });
              const artifact = runArtifacts.artifacts.find(a => a.name === artifactName);
              if (artifact) {
                directArtifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              }
            } catch (e) {
              core.warning(`Could not resolve direct artifact URL: ${e.message}`);
            }

            const footerLines = [
              '',
              '---',
              `📦 [Artefakty Lighthouse \`${artifactName}\`](${directArtifactUrl})`,
            ];
            if (htmlPath) {
              footerLines.push(`📄 [Pełny raport HTML dla \`/technologie\`](${directArtifactUrl}) — po rozpakowaniu: \`${htmlPath}\``);
            }
            footerLines.push('', `> ${reportNote}`);
            const footer = footerLines.join('\n');
            const fullBody = `${marker}\n${body}${footer}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            }

      - name: Enforce thresholds
        if: always()
        run: |
          if [ "${{ steps.metrics.outputs.passed }}" != "true" ]; then
            echo "::error::Lighthouse thresholds not met for /technologie (${{ matrix.profile }})"
            exit 1
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-${{ matrix.profile }}-${{ github.run_id }}
          path: .lighthouseci/${{ matrix.profile }}
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }}
