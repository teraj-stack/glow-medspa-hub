name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read



jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI (${{ matrix.profile }})
        id: lhci
        run: lhci autorun --config=./.lighthouserc.${{ matrix.profile }}.json
        continue-on-error: true

      - name: Extract /technologie metrics
        if: always()
        id: metrics
        uses: actions/github-script@v7
        env:
          PROFILE: ${{ matrix.profile }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const profile = process.env.PROFILE;
            const dir = `.lighthouseci/${profile}`;
            const targetPath = '/technologie';

            const thresholds = profile === 'mobile'
              ? { lcp: 2500, cls: 0.1, perf: 0.9 }
              : { lcp: 2000, cls: 0.1, perf: 0.9 };

            const manifestPath = path.join(dir, 'manifest.json');
            if (!fs.existsSync(manifestPath)) {
              core.setFailed(`Manifest missing at ${manifestPath} — Lighthouse run did not produce output.`);
              const summary = {
                profile,
                targetPath,
                passed: false,
                error: 'Manifest missing — Lighthouse run did not produce output.',
                thresholds,
                metrics: {},
                artifactUrl: '',
                htmlPath: '',
                reportHtmlNote: '',
              };
              fs.writeFileSync(`.lighthouseci/summary-${profile}.json`, JSON.stringify(summary, null, 2));
              return;
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

            // Pick representative runs for /technologie (prefer isRepresentativeRun)
            const matches = manifest.filter(m => {
              try { return new URL(m.url).pathname === targetPath; } catch { return false; }
            });
            const picked = matches.filter(m => m.isRepresentativeRun);
            const runs = (picked.length ? picked : matches);

            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`;
            const htmlPath = runs[0]?.htmlPath
              ? path.relative(`.lighthouseci/${profile}`, runs[0].htmlPath)
              : '';
            const reportHtmlNote = htmlPath
              ? `Pełny raport HTML po rozpakowaniu: \`${htmlPath}\``
              : 'Pełny raport HTML dostępny w artefaktach powyżej.';

            if (!runs.length) {
              const summary = {
                profile,
                targetPath,
                passed: false,
                error: `Brak pomiarów dla \`${targetPath}\`.`,
                thresholds,
                metrics: {},
                artifactUrl,
                htmlPath,
                reportHtmlNote,
              };
              fs.writeFileSync(`.lighthouseci/summary-${profile}.json`, JSON.stringify(summary, null, 2));
              return;
            }

            const rows = [];
            let allPassed = true;
            for (const run of runs) {
              const report = JSON.parse(fs.readFileSync(run.jsonPath, 'utf8'));
              const a = report.audits;
              const lcp = a['largest-contentful-paint']?.numericValue ?? NaN;
              const cls = a['cumulative-layout-shift']?.numericValue ?? NaN;
              const fcp = a['first-contentful-paint']?.numericValue ?? NaN;
              const tbt = a['total-blocking-time']?.numericValue ?? NaN;
              const perfScore = report.categories?.performance?.score ?? 0;
              const lcpOk = lcp <= thresholds.lcp;
              const clsOk = cls <= thresholds.cls;
              const perfOk = perfScore >= thresholds.perf;
              if (!(lcpOk && clsOk && perfOk)) allPassed = false;
              rows.push({ lcp, cls, fcp, tbt, perfScore, lcpOk, clsOk, perfOk });
            }

            const r = rows[0]; // representative
            const summary = {
              profile,
              targetPath,
              passed: allPassed,
              thresholds,
              metrics: {
                lcp: r.lcp,
                cls: r.cls,
                fcp: r.fcp,
                tbt: r.tbt,
                perfScore: r.perfScore,
                lcpOk: r.lcpOk,
                clsOk: r.clsOk,
                perfOk: r.perfOk,
              },
              artifactUrl,
              htmlPath,
              reportHtmlNote,
              runCount: runs.length,
            };

            fs.writeFileSync(`.lighthouseci/summary-${profile}.json`, JSON.stringify(summary, null, 2));

            const fmtMs = (n) => Number.isFinite(n) ? `${Math.round(n)} ms` : 'n/a';
            const fmtCls = (n) => Number.isFinite(n) ? n.toFixed(3) : 'n/a';
            const icon = (ok) => ok ? '✅' : '❌';
            const body = [
              `### ${icon(allPassed)} ${profile === 'mobile' ? '📱 Mobile' : '💻 Desktop'} — \`${targetPath}\``,
              ``,
              `| Metryka | Wynik | Próg | Status |`,
              `| --- | ---: | ---: | :---: |`,
              `| Performance | ${(r.perfScore * 100).toFixed(0)} | ≥ ${(thresholds.perf * 100).toFixed(0)} | ${icon(r.perfOk)} |`,
              `| **LCP** | **${fmtMs(r.lcp)}** | < ${thresholds.lcp} ms | ${icon(r.lcpOk)} |`,
              `| **CLS** | **${fmtCls(r.cls)}** | < ${thresholds.cls} | ${icon(r.clsOk)} |`,
              `| FCP | ${fmtMs(r.fcp)} | — | – |`,
              `| TBT | ${fmtMs(r.tbt)} | — | – |`,
              ``,
              `_Reprezentatywny przebieg z ${runs.length} pomiaru/ów. [Pobierz artefakty \`lhci-${profile}-${context.runId}\`](${artifactUrl}). ${reportHtmlNote}_`,
            ].join('\n');

            core.setOutput('summary', body);
            core.setOutput('passed', allPassed ? 'true' : 'false');
            await core.summary.addRaw(body).write();

      - name: Enforce thresholds
        if: always()
        run: |
          if [ "${{ steps.metrics.outputs.passed }}" != "true" ]; then
            echo "::error::Lighthouse thresholds not met for /technologie (${{ matrix.profile }})"
            exit 1
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-${{ matrix.profile }}-${{ github.run_id }}
          path: .lighthouseci/${{ matrix.profile }}
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }}

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-summary-${{ matrix.profile }}
          path: .lighthouseci/summary-${{ matrix.profile }}.json
          retention-days: 1
          overwrite: true

  comment:
    name: Comment combined Lighthouse results
    needs: [lighthouse]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lhci-summary-mobile
          path: summaries
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: lhci-summary-desktop
          path: summaries
        continue-on-error: true

      - name: Build combined PR comment
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summariesDir = 'summaries';

            const profiles = ['mobile', 'desktop'];
            const profileEmoji = { mobile: '📱 Mobile', desktop: '💻 Desktop' };
            const fmtMs = (n) => Number.isFinite(n) ? `${Math.round(n)} ms` : 'n/a';
            const fmtCls = (n) => Number.isFinite(n) ? n.toFixed(3) : 'n/a';
            const icon = (ok) => ok ? '✅' : '❌';

            let allPassed = true;
            const sections = [];
            const artifactLines = [];

            for (const profile of profiles) {
              const filePath = path.join(summariesDir, `summary-${profile}.json`);
              if (!fs.existsSync(filePath)) {
                sections.push(`### ❌ ${profileEmoji[profile]} — brak danych\n\nLighthouse (${profile}) nie wygenerował raportu.`);
                allPassed = false;
                continue;
              }
              const s = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              if (s.error) {
                sections.push(`### ❌ ${profileEmoji[profile]} — ${s.error}`);
                allPassed = false;
                continue;
              }

              const m = s.metrics || {};
              if (!s.passed) allPassed = false;

              sections.push([
                `### ${icon(s.passed)} ${profileEmoji[profile]} — \`${s.targetPath}\``,
                ``,
                `| Metryka | Wynik | Próg | Status |`,
                `| --- | ---: | ---: | :---: |`,
                `| Performance | ${(m.perfScore * 100).toFixed(0)} | ≥ ${(s.thresholds.perf * 100).toFixed(0)} | ${icon(m.perfOk)} |`,
                `| **LCP** | **${fmtMs(m.lcp)}** | < ${s.thresholds.lcp} ms | ${icon(m.lcpOk)} |`,
                `| **CLS** | **${fmtCls(m.cls)}** | < ${s.thresholds.cls} | ${icon(m.clsOk)} |`,
                `| FCP | ${fmtMs(m.fcp)} | — | – |`,
                `| TBT | ${fmtMs(m.tbt)} | — | – |`,
                ``,
                `_Reprezentatywny przebieg z ${s.runCount ?? '?'} pomiaru/ów. ${s.reportHtmlNote}_`,
              ].join('\n'));

              artifactLines.push(`- 📦 \`lhci-${profile}-${context.runId}\`: ${s.artifactUrl || 'n/a'}`);
              if (s.htmlPath) {
                artifactLines.push(`  - 📄 Pełny raport HTML po rozpakowaniu: \`${s.htmlPath}\``);
              }
            }

            const body = [
              `## ${icon(allPassed)} Lighthouse — \`/technologie\``,
              ``,
              sections.join('\n\n'),
              ``,
              `---`,
              `**Progi:** LCP < 2500 ms (mobile) / < 2000 ms (desktop), CLS < 0.1, Performance ≥ 90.`,
              ``,
              `### Artefakty Lighthouse`,
              ...artifactLines,
            ].join('\n');

            core.setOutput('body', body);

      - name: Post or update PR comment
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.build.outputs.body }}
        with:
          script: |
            const body = process.env.BODY;
            if (!body) return;
            const marker = '<!-- lhci-comment:/technologie -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            }
