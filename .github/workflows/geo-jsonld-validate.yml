name: Geo JSON-LD validate (schema.org GeoCoordinates)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geo-validate:
    name: Validate JSON-LD geo coordinates match src/config/clinic.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate GeoCoordinates in source
        run: npm run validate:geo

      - name: Upload geo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-jsonld-report
          path: reports/geo-jsonld.json
          if-no-files-found: ignore
