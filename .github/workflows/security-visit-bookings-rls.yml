name: Security — visit_bookings RLS

# Weryfikuje polityki RLS tabeli `visit_bookings`:
#  1. anon nie ma żadnego dostępu (SELECT/UPDATE/DELETE, w tym kolumny
#     wrażliwe: cancel_token, patient_email, stripe_*). Łapie regresję
#     polityki SELECT bez scope na user_id.
#  2. Admin (rola `admin` w user_roles) ma pełny dostęp; zwykły user
#     widzi i może modyfikować WYŁĄCZNIE swoje wiersze.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/lib/visit-bookings.functions.ts"
      - "src/test/security/visit-bookings-rls.test.ts"
      - "src/test/security/visit-bookings-roles-rls.test.ts"
      - ".github/workflows/security-visit-bookings-rls.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "src/lib/visit-bookings.functions.ts"
      - "src/test/security/visit-bookings-rls.test.ts"
      - "src/test/security/visit-bookings-roles-rls.test.ts"
      - ".github/workflows/security-visit-bookings-rls.yml"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  test:
    name: RLS visit_bookings (anon + role-based)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run security tests
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run src/test/security/visit-bookings-rls.test.ts src/test/security/visit-bookings-roles-rls.test.ts --reporter=verbose
