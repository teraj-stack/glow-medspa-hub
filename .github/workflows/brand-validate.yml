name: Brand validate (dist)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write
  security-events: write   # required for github/codeql-action/upload-sarif

jobs:
  brand-validate:
    name: Validate "BM Clinics" in dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pre-build brand validation (source)
        run: npm run validate:brand

      - name: Build (Vite only, no post-build brand step)
        run: npx vite build

      - name: Brand validate-or-fix in dist (strict)
        id: brand
        continue-on-error: true
        run: |
          set +e
          npm run brand:validate-or-fix:dist:strict
          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "brand:validate-or-fix:dist:strict exit code = $RC"
          # Don't fail the step here — the interpret step decides job status.
          exit 0
      - name: Export brand validation results to SARIF
        if: always()
        run: npm run brand:report:sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/brand-fix-dist.sarif
          category: brand-validate-dist

      - name: Publish SARIF results as PR inline annotations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/brand-fix-dist.sarif';
            if (!fs.existsSync(path)) {
              core.warning(`SARIF file not found at ${path}; skipping inline annotations.`);
              return;
            }

            const sarif = JSON.parse(fs.readFileSync(path, 'utf8'));
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;

            // Map SARIF level → GitHub Checks annotation_level
            const levelMap = {
              error: 'failure',
              warning: 'warning',
              note: 'notice',
              none: 'notice',
            };

            // Flatten all results across runs into Checks annotations.
            const annotations = [];
            for (const run of sarif.runs ?? []) {
              const rules = new Map(
                (run.tool?.driver?.rules ?? []).map((r) => [r.id, r]),
              );
              for (const res of run.results ?? []) {
                const loc = res.locations?.[0]?.physicalLocation;
                const uri = loc?.artifactLocation?.uri;
                const region = loc?.region;
                if (!uri || !region?.startLine) continue;

                const rule = rules.get(res.ruleId);
                const ruleName = rule?.shortDescription?.text ?? res.ruleId ?? 'brand';
                const message =
                  res.message?.text ??
                  rule?.fullDescription?.text ??
                  'Brand validation finding';
                const snippet = region.snippet?.text;

                annotations.push({
                  path: uri,
                  start_line: region.startLine,
                  end_line: region.endLine ?? region.startLine,
                  // start_column/end_column are only valid when start_line === end_line
                  ...(region.startColumn && (!region.endLine || region.endLine === region.startLine)
                    ? {
                        start_column: region.startColumn,
                        end_column: region.endColumn ?? region.startColumn,
                      }
                    : {}),
                  annotation_level: levelMap[res.level] ?? 'warning',
                  title: `[${res.ruleId ?? 'brand'}] ${ruleName}`,
                  message: snippet ? `${message}\n\nSnippet:\n${snippet}` : message,
                });
              }
            }

            core.info(`Collected ${annotations.length} SARIF annotations.`);

            const errors = annotations.filter((a) => a.annotation_level === 'failure').length;
            const warnings = annotations.filter((a) => a.annotation_level === 'warning').length;
            const notices = annotations.filter((a) => a.annotation_level === 'notice').length;

            // Create a single check run with up to 50 annotations per API call.
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Brand / SARIF inline annotations',
              head_sha: sha,
              status: 'completed',
              conclusion: errors > 0 ? 'failure' : (warnings > 0 ? 'neutral' : 'success'),
              output: {
                title:
                  annotations.length === 0
                    ? 'No brand findings'
                    : `${annotations.length} brand finding(s): ${errors} error, ${warnings} warning, ${notices} notice`,
                summary:
                  'Inline annotations generated from `reports/brand-fix-dist.sarif`. ' +
                  'Open the **Files changed** tab of the PR to see them next to the affected lines, ' +
                  'or use the **Checks** tab → *Brand / SARIF inline annotations*.',
                annotations: annotations.slice(0, 50),
              },
            });

            // GitHub Checks API caps annotations at 50 per request — send the rest in updates.
            for (let i = 50; i < annotations.length; i += 50) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                output: {
                  title:
                    `${annotations.length} brand finding(s): ${errors} error, ${warnings} warning, ${notices} notice`,
                  summary:
                    'Inline annotations generated from `reports/brand-fix-dist.sarif`.',
                  annotations: annotations.slice(i, i + 50),
                },
              });
            }




      - name: Upload brand reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-reports
          path: |
            reports/brand-fix-dist-report.json
            reports/brand-fix-dist-report.md
            reports/brand-fix-dist.sarif
          if-no-files-found: ignore

      - name: Publish per-exit-code GitHub checks
        if: always()
        uses: actions/github-script@v7
        env:
          BRAND_EXIT: ${{ steps.brand.outputs.exit_code }}
        with:
          script: |
            const rc = parseInt(process.env.BRAND_EXIT ?? '', 10);
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;

            // Each entry becomes its own check run on the commit, so every
            // exit code shows up as a discrete line in the commit's checks
            // list. Exactly one is "success" (the active one); the others
            // are "neutral" (informational, not failing).
            const checks = [
              {
                code: 0,
                name: 'Brand / 0 · Clean (no "BM Clinics" in dist)',
                title: 'No occurrences of "BM Clinics" in dist',
                summary: 'Build artifacts are clean. Nothing to fix.',
              },
              {
                code: 1,
                name: 'Brand / 1 · Auto-fix applied (strict fail)',
                title: 'Safe replacements applied in dist',
                summary:
                  'Safe replacements of `BM Clinics` → `BMClinics.ai` were applied to dist. ' +
                  'Strict mode fails the build so the underlying **source** can be cleaned up. ' +
                  'See artifact `brand-reports` → `brand-fix-dist-report.md`.',
              },
              {
                code: 2,
                name: 'Brand / 2 · Validation still failing after fix',
                title: 'Unsafe "BM Clinics" occurrences remain',
                summary:
                  'Risky occurrences remain in dist (URLs, identifiers, or other unsafe contexts) ' +
                  'that the auto-fix refused to touch. **Manual cleanup required.** ' +
                  'See artifact `brand-reports` for the list of unsafe matches.',
              },
              {
                code: 3,
                name: 'Brand / 3 · Auto-fix script crashed',
                title: 'scripts/fix-brand-dist.mjs failed',
                summary:
                  'The auto-fix script itself errored out. Investigate the job log for ' +
                  '`brand:validate-or-fix:dist:strict`.',
              },
            ];

            const isUnknown = !checks.some((c) => c.code === rc);

            for (const c of checks) {
              const active = c.code === rc;
              // Active code that means "all good" → success.
              // Active code that means a real failure → failure.
              // Inactive codes → neutral (informational placeholder).
              const conclusion = active
                ? (c.code === 0 ? 'success' : 'failure')
                : 'neutral';

              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: c.name,
                head_sha: sha,
                status: 'completed',
                conclusion,
                output: {
                  title: active ? `▶ ${c.title}` : `(inactive) ${c.title}`,
                  summary: active
                    ? `**This is the outcome for this build (exit code ${rc}).**\n\n${c.summary}`
                    : `Not the outcome for this build. Shown for visibility so every possible exit code has a slot in the commit's check list.\n\n${c.summary}`,
                },
              });
            }

            if (isUnknown) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: `Brand / ${rc} · Unknown exit code`,
                head_sha: sha,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: `Unknown exit code ${rc}`,
                  summary:
                    `\`brand:validate-or-fix:dist:strict\` returned an exit code ` +
                    `(${rc}) that the workflow does not recognize. Update ` +
                    '`.github/workflows/brand-validate.yml` to handle it.',
                },
              });
            }

      - name: Interpret exit code & set job status
        if: always()
        env:
          RC: ${{ steps.brand.outputs.exit_code }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Brand validation (dist)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "Exit code: \`$RC\`" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "Per-exit-code GitHub checks were published on this commit — see the **Checks** tab." >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          case "$RC" in
            0)
              echo "::notice title=Brand OK::No \"BM Clinics\" occurrences in dist."
              echo "✅ **Clean** — no \"BM Clinics\" occurrences in dist." >> "$SUMMARY"
              exit 0
              ;;
            1)
              echo "::warning title=Brand auto-fix applied::Safe replacements of \"BM Clinics\" → \"BMClinics.ai\" were applied in dist. Review reports/brand-fix-dist-report.md and update source."
              echo "⚠️ **Auto-fix applied (exit 1)** — safe replacements were made in dist. Strict mode treats this as a failure so the underlying source can be cleaned up." >> "$SUMMARY"
              exit 1
              ;;
            2)
              echo "::error title=Brand validation failed after fix::Unsafe \"BM Clinics\" occurrences remain in dist (URLs, identifiers, or other risky contexts). Manual cleanup required."
              echo "❌ **Validation still failing after auto-fix (exit 2)** — risky \"BM Clinics\" occurrences remain. Manual cleanup required." >> "$SUMMARY"
              exit 1
              ;;
            3)
              echo "::error title=Brand auto-fix script failed::scripts/fix-brand-dist.mjs exited with a non-recoverable error. Check the job log."
              echo "💥 **Auto-fix script crashed (exit 3)** — investigate the script logs above." >> "$SUMMARY"
              exit 1
              ;;
            *)
              echo "::error title=Brand validation: unknown exit code::Unexpected exit code $RC from brand:validate-or-fix:dist:strict."
              echo "❓ **Unknown exit code $RC** — update \`.github/workflows/brand-validate.yml\` to handle it." >> "$SUMMARY"
              exit 1
              ;;
          esac
