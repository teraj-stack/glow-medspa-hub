name: Security Scan (SAST + SCA)

# Automatyczne skany bezpieczeństwa:
# - SAST: CodeQL (JavaScript/TypeScript)
# - SCA:  npm audit (high/critical) + Trivy (filesystem, vuln+secret+misconfig)
# Uruchamiane przy każdym pull request, push do main, harmonogramowo,
# oraz jako wymagany "gate" przed deployem (deploy-cloudflare.yml czeka na sukces).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # poniedziałek 03:00 UTC
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-codeql:
    name: SAST · CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: always

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn
          # Retencja: PR — 14 dni (krótkie cykle review), main/schedule — 90 dni (audyt).
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

  pr-sarif-summary:
    name: PR · SARIF summary
    needs: [sast-codeql, sca-trivy]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          path: sarif
          pattern: '*sarif*'
          merge-multiple: true

      - name: Comment PR with SARIF findings summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'sarif';
            if (!fs.existsSync(dir)) {
              core.info('No SARIF artifacts found.');
              return;
            }
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap(e => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            const files = walk(dir).filter(f => f.endsWith('.sarif'));
            const sevCounts = { error: 0, warning: 0, note: 0 };
            const perTool = [];
            for (const full of files) {
              let sarif;
              try { sarif = JSON.parse(fs.readFileSync(full, 'utf8')); }
              catch { continue; }
              for (const run of sarif.runs ?? []) {
                const tool = run.tool?.driver?.name ?? path.basename(full);
                let e=0,w=0,n=0;
                for (const r of run.results ?? []) {
                  const lvl = r.level ?? 'warning';
                  if (lvl === 'error') e++;
                  else if (lvl === 'note') n++;
                  else w++;
                }
                sevCounts.error += e; sevCounts.warning += w; sevCounts.note += n;
                perTool.push({ tool, file: path.relative(dir, full), e, w, n, total: e+w+n });
              }
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rows = perTool.map(t =>
              `| \`${t.tool}\` | ${t.total} | ${t.e} | ${t.w} | ${t.n} | \`${t.file}\` |`
            ).join('\n') || '| _no SARIF results_ | 0 | 0 | 0 | 0 | — |';
            const body = [
              '### Security scan · SARIF summary',
              '',
              `Total: **${sevCounts.error}** error · **${sevCounts.warning}** warning · **${sevCounts.note}** note`,
              '',
              '| Tool | Total | Error | Warning | Note | Artifact |',
              '|------|------:|------:|--------:|-----:|----------|',
              rows,
              '',
              'Inline annotations: PR **Files changed** tab (via Code Scanning).',
              `Raw SARIF: [workflow run artifacts](${runUrl}).`,
              '',
              '<!-- security-scan-sarif-summary -->',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const prev = comments.find(c => c.body?.includes('<!-- security-scan-sarif-summary -->'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body,
              });
            }

  sca-npm-audit:
    name: SCA · npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (bun, frozen)
        run: bun install --frozen-lockfile

      # `bun audit` jeszcze nie zwraca pełnego raportu — używamy `npm audit`
      # po wygenerowaniu package-lock.json z aktualnego package.json.
      - name: Generate package-lock for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: npm audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (JSON report)
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore

  sca-trivy:
    name: SCA · Trivy (fs + secrets + misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
